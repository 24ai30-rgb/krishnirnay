services:
  - type: web
    name: krishinirnay-server
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Originally measured ~728MB resident (full TensorFlow + full
    # torch/ultralytics + the scikit-learn risk model) — too big for the
    # free tier's 512MB. Disease and Pest were converted to run through
    # lightweight ai-edge-litert/onnxruntime interpreters instead (verified
    # numerically equivalent to the original models — see disease_model.py
    # and pest_model.py's own comments), bringing the real measured peak
    # (all three models loaded) down to ~335MB resident. Free fits with a
    # real ~175MB margin.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Weather/Market honestly report 503 "unavailable" without these —
      # they were missing from this file entirely, so a Blueprint deploy
      # never prompted for them and both features would have silently
      # stayed unavailable on the deployed server.
      - key: WEATHER_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
