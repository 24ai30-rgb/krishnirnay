services:
  - type: web
    name: krishinirnay-server
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # TensorFlow + the Keras disease model + the scikit-learn risk model
    # measured ~728MB resident locally — Free and Starter both cap at
    # 512MB RAM and will OOM-crash-loop this service. Standard (2GB) is the
    # smallest Render plan with enough headroom.
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Weather/Market honestly report 503 "unavailable" without these —
      # they were missing from this file entirely, so a Blueprint deploy
      # never prompted for them and both features would have silently
      # stayed unavailable on the deployed server.
      - key: WEATHER_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
